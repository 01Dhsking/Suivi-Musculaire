services:
  web:
    build:
      context: .
      target: runner
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
    networks:
      - dokploy-network
      - app-data
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: suivi
      PGPASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans Dokploy ou .env}
      PGDATABASE: suivi_musculaire
      APP_PASSWORD: ${APP_PASSWORD:?Définis APP_PASSWORD dans Dokploy ou .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(5000),headers:{Authorization:'Basic '+Buffer.from('admin:'+process.env.APP_PASSWORD).toString('base64')}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - app-data
    environment:
      POSTGRES_USER: suivi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans Dokploy ou .env}
      POSTGRES_DB: suivi_musculaire
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suivi -d suivi_musculaire"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  postgres_data:

networks:
  dokploy-network:
    name: dokploy-network
    external: true
  app-data:
    internal: true
